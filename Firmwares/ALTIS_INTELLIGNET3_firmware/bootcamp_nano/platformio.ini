[platformio]
default_envs = nano_lsm6dso, nano_mpu6050

[env]
platform = atmelavr@5.2.0
board = nanoatmega328new
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra

[env:nano_lsm6dso]
build_flags = ${env.build_flags} -DBOOTCAMP_LSM6DSO

[env:nano_mpu6050]
build_flags = ${env.build_flags} -DBOOTCAMP_MPU6050
