<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="color-scheme" content="dark">
  <title>FLASH6 HUD LIVE</title>
  <link rel="icon" href="img/Flash_logo.svg" type="image/svg+xml">
  <style>
    *,*::before,*::after{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}
    :root{
      --white:#f4f4f5;
      --muted:rgba(228,228,231,.68);
      --faint:rgba(228,228,231,.42);
      --line:rgba(255,255,255,.28);
      --ok:#35d47a;
      --warn:#f4c66a;
      --bad:#ff6475;
      --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
      --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","Pretendard","Noto Sans KR","Segoe UI",sans-serif;
    }
    body{
      color:var(--white);
      font-family:var(--sans);
      -webkit-font-smoothing:antialiased;
      text-rendering:geometricPrecision;
    }
    .hud-top{
      position:fixed;
      top:clamp(24px,3.6vh,58px);
      left:clamp(34px,4.2vw,82px);
      right:clamp(34px,4.2vw,82px);
      z-index:3;
      display:grid;
      grid-template-columns:minmax(220px,1fr) minmax(320px,1.4fr) minmax(260px,1fr);
      align-items:start;
      gap:28px;
      pointer-events:none;
      text-shadow:0 3px 14px rgba(0,0,0,.66);
    }
    .source-pill{
      justify-self:start;
      display:inline-flex;
      align-items:center;
      gap:10px;
      min-height:36px;
      padding:0 14px;
      border:1px solid rgba(255,255,255,.32);
      border-radius:5px;
      background:rgba(13,16,20,.42);
      color:rgba(250,250,250,.88);
      font:650 13px/1 var(--sans);
      letter-spacing:.035em;
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
    }
    .source-pill::before{
      content:"";
      width:9px;
      height:9px;
      flex:0 0 9px;
      border-radius:50%;
      background:#7c828c;
      box-shadow:0 0 0 4px rgba(124,130,140,.12);
    }
    .source-pill.is-online::before{
      background:var(--ok);
      box-shadow:0 0 0 4px rgba(53,212,122,.13);
    }
    .mission-name{
      justify-self:center;
      max-width:100%;
      overflow:hidden;
      color:rgba(255,255,255,.68);
      font:300 clamp(17px,1.45vw,25px)/1.15 var(--sans);
      letter-spacing:-.025em;
      text-align:center;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .clock{
      justify-self:end;
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap:3px;
      min-width:250px;
    }
    .clock-label{
      max-width:360px;
      overflow:hidden;
      color:rgba(255,255,255,.58);
      font:500 10px/1.2 var(--sans);
      letter-spacing:.08em;
      text-overflow:ellipsis;
      text-transform:uppercase;
      white-space:nowrap;
    }
    .clock-row{
      display:flex;
      align-items:baseline;
      gap:11px;
    }
    .clock-tag{
      color:rgba(255,255,255,.55);
      font:300 clamp(25px,2.1vw,37px)/1 var(--sans);
    }
    .clock-time{
      min-width:250px;
      color:#fff;
      font:200 clamp(43px,4vw,72px)/.95 var(--sans);
      font-variant-numeric:tabular-nums;
      letter-spacing:.01em;
      text-align:right;
    }
    .hud-bottom{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      z-index:2;
      min-height:clamp(210px,29vh,320px);
      padding:42px clamp(34px,4.2vw,82px) clamp(28px,4vh,52px);
      display:grid;
      grid-template-columns:minmax(330px,.9fr) minmax(520px,1.5fr) minmax(190px,.58fr);
      align-items:end;
      gap:clamp(26px,3vw,62px);
      pointer-events:none;
    }
    .hud-bottom::before{
      content:"";
      position:absolute;
      inset:-120px 0 0;
      z-index:-1;
      background:linear-gradient(180deg,rgba(3,5,8,0),rgba(3,5,8,.16) 23%,rgba(3,5,8,.55) 59%,rgba(3,5,8,.84));
    }
    .instrument-group{
      display:flex;
      align-items:flex-end;
      gap:clamp(25px,2.2vw,46px);
    }
    .instrument{
      --progress:0%;
      width:min(210px,14vw);
      min-width:148px;
    }
    .instrument-readout{
      min-height:66px;
      display:grid;
      grid-template-columns:minmax(0,1fr) 1px minmax(60px,.82fr);
      align-items:center;
      gap:14px;
    }
    .instrument-copy{
      min-width:0;
      display:flex;
      flex-direction:column;
      gap:5px;
    }
    .instrument-label{
      overflow:hidden;
      color:rgba(255,255,255,.83);
      font:620 11px/1 var(--sans);
      letter-spacing:.12em;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .instrument-unit{
      color:rgba(255,255,255,.58);
      font:500 10px/1 var(--sans);
      letter-spacing:.08em;
    }
    .instrument-divider{
      align-self:stretch;
      width:1px;
      min-height:54px;
      background:rgba(255,255,255,.48);
    }
    .instrument-value{
      min-width:0;
      color:#fff;
      font:280 clamp(29px,2.35vw,43px)/1 var(--sans);
      font-variant-numeric:tabular-nums;
      letter-spacing:-.045em;
      white-space:nowrap;
    }
    .instrument-track{
      width:100%;
      height:2px;
      margin-top:13px;
      overflow:hidden;
      background:rgba(255,255,255,.21);
    }
    .instrument-track::after{
      content:"";
      display:block;
      width:var(--progress);
      height:100%;
      background:rgba(255,255,255,.96);
      box-shadow:0 0 8px rgba(255,255,255,.26);
      transition:width .16s linear;
    }
    .mission-center{
      min-width:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:10px;
      padding-bottom:3px;
    }
    .flight-state{
      max-width:100%;
      overflow:hidden;
      color:#fff;
      font:650 clamp(16px,1.35vw,23px)/1 var(--mono);
      letter-spacing:.18em;
      text-align:center;
      text-overflow:ellipsis;
      text-transform:uppercase;
      white-space:nowrap;
    }
    .flight-state.is-warn{color:#fff0c9}
    .flight-state.is-bad{color:#ffd5da}
    .timeline{
      position:relative;
      width:min(820px,100%);
      height:68px;
      overflow:hidden;
      -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);
      mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);
    }
    .timeline::before{
      content:"";
      position:absolute;
      top:28px;
      left:0;
      right:0;
      height:1px;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.58) 12%,rgba(255,255,255,.58) 88%,transparent);
    }
    .timeline::after{
      content:"";
      position:absolute;
      top:20px;
      left:50%;
      width:16px;
      height:16px;
      transform:translateX(-50%);
      border:2px solid #fff;
      border-radius:50%;
      background:rgba(5,7,10,.48);
      box-shadow:0 0 0 5px rgba(255,255,255,.08);
    }
    .timeline-rail{
      position:absolute;
      top:0;
      left:50%;
      display:flex;
      gap:clamp(50px,4.3vw,86px);
      transform:translateX(-45px);
      transition:transform .28s cubic-bezier(.2,.8,.2,1);
    }
    .timeline-item{
      position:relative;
      width:90px;
      height:68px;
      flex:0 0 90px;
      opacity:.38;
    }
    .timeline-item i{
      position:absolute;
      top:24px;
      left:50%;
      width:9px;
      height:9px;
      transform:translateX(-50%);
      border:1.5px solid rgba(255,255,255,.72);
      border-radius:50%;
      background:#15181d;
    }
    .timeline-item span{
      position:absolute;
      top:46px;
      left:50%;
      transform:translateX(-50%);
      color:rgba(255,255,255,.72);
      font:600 9px/1 var(--mono);
      letter-spacing:.14em;
      white-space:nowrap;
    }
    .timeline-item.is-passed{opacity:.7}
    .timeline-item.is-passed i{background:rgba(255,255,255,.58)}
    .timeline-item.is-active{opacity:1}
    .timeline-item.is-active i{background:#fff;border-color:#fff}
    .timeline-meta{
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:7px 18px;
      max-width:100%;
      color:rgba(255,255,255,.62);
      font:620 10px/1.2 var(--mono);
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .timeline-meta strong{color:rgba(255,255,255,.92);font-weight:700}
    .altitude-wrap{
      display:flex;
      justify-content:flex-end;
      align-items:flex-end;
    }
    .altitude-wrap .instrument{width:min(230px,16vw)}
    .offline-note{
      position:fixed;
      left:50%;
      bottom:18px;
      z-index:5;
      transform:translateX(-50%);
      color:rgba(255,255,255,.36);
      font:600 9px/1 var(--mono);
      letter-spacing:.16em;
      opacity:0;
      transition:opacity .2s ease;
    }
    body.is-offline .offline-note{opacity:1}
    @media(max-width:1100px){
      .hud-top{
        grid-template-columns:1fr 1fr;
      }
      .mission-name{display:none}
      .clock{grid-column:2}
      .hud-bottom{
        grid-template-columns:1fr 1fr;
      }
      .mission-center{
        grid-column:1/-1;
        grid-row:1;
      }
      .instrument-group{grid-column:1;grid-row:2}
      .altitude-wrap{grid-column:2;grid-row:2}
    }
  </style>
</head>
<body class="is-offline">
  <header class="hud-top">
    <div id="sourcePill" class="source-pill">STAGE 1 OFFLINE</div>
    <div id="missionName" class="mission-name">FLASH6 MISSION</div>
    <div class="clock">
      <div id="clockLabel" class="clock-label">WAITING FOR TELEMETRY</div>
      <div class="clock-row"><span id="clockTag" class="clock-tag">T-</span><span id="clockTime" class="clock-time">--:--</span></div>
    </div>
  </header>

  <main class="hud-bottom">
    <section class="instrument-group" aria-label="비행 계기">
      <article id="speedInstrument" class="instrument">
        <div class="instrument-readout">
          <div class="instrument-copy"><span class="instrument-label">VELOCITY</span><span class="instrument-unit">m/s</span></div>
          <i class="instrument-divider"></i>
          <strong id="speedValue" class="instrument-value">--</strong>
        </div>
        <div class="instrument-track"></div>
      </article>
      <article id="gforceInstrument" class="instrument">
        <div class="instrument-readout">
          <div class="instrument-copy"><span class="instrument-label">G-FORCE</span><span class="instrument-unit">g</span></div>
          <i class="instrument-divider"></i>
          <strong id="gforceValue" class="instrument-value">--</strong>
        </div>
        <div class="instrument-track"></div>
      </article>
    </section>

    <section class="mission-center">
      <div id="flightState" class="flight-state">PRE_FLIGHT</div>
      <div id="timeline" class="timeline">
        <div id="timelineRail" class="timeline-rail">
          <div class="timeline-item is-active"><i></i><span>STANDBY</span></div>
          <div class="timeline-item"><i></i><span>COUNT</span></div>
          <div class="timeline-item"><i></i><span>IGNITION</span></div>
          <div class="timeline-item"><i></i><span>POWERED</span></div>
          <div class="timeline-item"><i></i><span>COASTING</span></div>
          <div class="timeline-item"><i></i><span>SEPARATION</span></div>
          <div class="timeline-item"><i></i><span>EJECTION</span></div>
          <div class="timeline-item"><i></i><span>DESCENT</span></div>
          <div class="timeline-item"><i></i><span>LANDED</span></div>
        </div>
      </div>
      <div class="timeline-meta">
        <span>ARM <strong id="armValue">--</strong></span>
        <span>IGN DELAY <strong id="ignitionDelayValue">--</strong> s</span>
        <span>PYRO <strong id="pyroValue">--</strong></span>
        <span>STORAGE <strong id="storageValue">--</strong></span>
      </div>
    </section>

    <section class="altitude-wrap">
      <article id="altitudeInstrument" class="instrument">
        <div class="instrument-readout">
          <div class="instrument-copy"><span class="instrument-label">ALTITUDE</span><span class="instrument-unit">m</span></div>
          <i class="instrument-divider"></i>
          <strong id="altitudeValue" class="instrument-value">--</strong>
        </div>
        <div class="instrument-track"></div>
      </article>
    </section>
  </main>
  <div class="offline-note">HUD LIVE · WAITING FOR MAIN CONSOLE OR AVIONICS</div>

  <script>
    (() => {
      "use strict";
      const CHANNEL_NAME = "hanwool_overlay_sync";
      const SYNC_KEY = "hanwool_overlay_latest";
      const params = new URLSearchParams(location.search);
      const $ = (id) => document.getElementById(id);
      const nodes = {
        source:$("sourcePill"), mission:$("missionName"), clockLabel:$("clockLabel"),
        clockTag:$("clockTag"), clockTime:$("clockTime"), state:$("flightState"),
        speed:$("speedValue"), gforce:$("gforceValue"), altitude:$("altitudeValue"),
        speedInstrument:$("speedInstrument"), gforceInstrument:$("gforceInstrument"),
        altitudeInstrument:$("altitudeInstrument"), timeline:$("timeline"),
        timelineRail:$("timelineRail"),
        timelineItems:Array.from(document.querySelectorAll(".timeline-item")),
        arm:$("armValue"), ignitionDelay:$("ignitionDelayValue"),
        pyro:$("pyroValue"), storage:$("storageValue")
      };
      const configuredMission = String(params.get("mission") || "FLASH6 MISSION").trim();
      let lastMessageAt = 0;
      let lastSample = null;
      let socket = null;
      let reconnectTimer = 0;

      function finite(value){
        const number = Number(value);
        return Number.isFinite(number) ? number : NaN;
      }
      function pick(data, keys, fallback){
        for(const key of keys){
          if(data && data[key] != null && data[key] !== "") return data[key];
        }
        return fallback;
      }
      function setText(node, value){
        if(!node) return;
        const next = String(value == null || value === "" ? "--" : value);
        if(node.textContent !== next) node.textContent = next;
      }
      function formatNumber(value, digits, fallback="--"){
        const number = finite(value);
        return Number.isFinite(number) ? number.toFixed(digits) : fallback;
      }
      function setProgress(node, value, max){
        const number = finite(value);
        const limit = finite(max);
        const ratio = Number.isFinite(number) && Number.isFinite(limit) && limit > 0
          ? Math.max(0, Math.min(1, number / limit))
          : 0;
        node.style.setProperty("--progress", (ratio * 100).toFixed(1) + "%");
      }
      function formatTimerBody(ms){
        const value = Math.max(0, Math.round(Math.abs(finite(ms) || 0)));
        const minutes = Math.floor(value / 60000);
        const seconds = Math.floor((value % 60000) / 1000);
        const centiseconds = Math.floor((value % 1000) / 10);
        return String(minutes).padStart(2,"0") + ":" +
          String(seconds).padStart(2,"0") + ":" +
          String(centiseconds).padStart(2,"0");
      }
      function timerParts(data){
        const explicit = String(pick(data, ["countdown","timerText"], "") || "").trim();
        const match = explicit.match(/^(T[+-])\s*(.*)$/i);
        if(match) return {tag:match[1].toUpperCase(), body:match[2] || "--:--"};
        const td = finite(pick(data, ["td","tdMs"], NaN));
        if(Number.isFinite(td)){
          const state = finite(pick(data, ["st","state"], 0));
          return {tag:(state === 1 || td < 0) ? "T-" : "T+", body:formatTimerBody(td)};
        }
        return {tag:"T-", body:"--:--"};
      }
      function stateInfo(data){
        const explicit = String(pick(data, ["stateText","phaseLabel"], "") || "").trim();
        const phaseCode = finite(pick(data, ["flightPhaseCode","flight_phase_code"], NaN));
        const state = finite(pick(data, ["st","state"], 0));
        if(explicit) return explicit.replace(/\s+/g," ");
        if(phaseCode === 1) return "POWERED_FLIGHT";
        if(phaseCode === 2) return "COASTING";
        if(phaseCode === 3) return "DESCENT";
        if(phaseCode === 4) return "LANDED";
        if(state === 1) return "COUNTDOWN";
        if(state === 2) return "IGNITION";
        if(state === 4) return "WAITING_LAUNCH";
        if(state === 5) return "LAUNCH_FAULT";
        return "PRE_FLIGHT";
      }
      function timelineIndex(data){
        const state = finite(pick(data, ["st","state"], 0));
        const phase = finite(pick(data, ["flightPhaseCode","flight_phase_code"], NaN));
        const deploymentState = finite(pick(data, ["deploymentState","deployment_state"], 0));
        const deploymentFlags = finite(pick(data, ["deploymentFlags","deployment_flags"], 0));
        let index = state === 1 ? 1 : (state === 2 || state === 3 || state === 4 || state === 5 ? 2 : 0);
        if(phase === 1) index = 3;
        else if(phase === 2) index = 4;
        else if(phase === 3) index = 7;
        else if(phase === 4) index = 8;
        if(!Number.isFinite(phase) || phase < 3){
          if((deploymentFlags & (1 << 5)) !== 0) index = 6;
          else if(deploymentState >= 2) index = 5;
        }
        return Math.max(0,Math.min(nodes.timelineItems.length - 1,index));
      }
      function rawSpeed(data){
        return finite(pick(data, ["speedMps","actual_speed_mps","vehicle_speed_mps","speed_mps"], NaN));
      }
      function rawAltitude(data){
        return finite(pick(data, ["altitudeM","baro_altitude_m","altitude_m","alt","ba"], NaN));
      }
      function rawGforce(data){
        const direct = finite(pick(data, ["gforceG","accel_mag_g","total_accel_g"], NaN));
        if(Number.isFinite(direct)) return direct;
        const ax = finite(pick(data, ["ax","accel_x"], NaN));
        const ay = finite(pick(data, ["ay","accel_y"], NaN));
        const az = finite(pick(data, ["az","accel_z"], NaN));
        return [ax,ay,az].every(Number.isFinite) ? Math.hypot(ax,ay,az) : NaN;
      }
      function updateTimeline(data){
        const index = timelineIndex(data);
        nodes.timelineItems.forEach((item,itemIndex)=>{
          item.classList.toggle("is-active",itemIndex === index);
          item.classList.toggle("is-passed",itemIndex < index);
        });
        const activeItem = nodes.timelineItems[index];
        if(nodes.timelineRail && activeItem){
          const center = activeItem.offsetLeft + activeItem.offsetWidth / 2;
          nodes.timelineRail.style.transform = "translateX(" + (-center) + "px)";
        }
      }
      function consume(input){
        if(!input || typeof input !== "object") return;
        const data = input.data && typeof input.data === "object"
          ? Object.assign({},input,input.data)
          : input;
        lastMessageAt = Date.now();
        lastSample = data;
        document.body.classList.remove("is-offline");

        const connectedRaw = pick(data, ["connected","linkOk"], true);
        const connected = connectedRaw === true || Number(connectedRaw) !== 0;
        const stage = Math.max(1,Math.min(2,Math.round(finite(pick(data, ["stageId","stage_id","node_id"], 1)) || 1)));
        nodes.source.classList.toggle("is-online",connected);
        setText(nodes.source,"STAGE " + stage + " " + (connected ? "LINKED" : "OFFLINE"));
        setText(nodes.mission,String(pick(data,["mission"],configuredMission) || configuredMission).trim());

        const state = stateInfo(data);
        setText(nodes.state,state);
        const tone = String(pick(data,["stateStatus"],"") || "").toLowerCase();
        nodes.state.classList.toggle("is-warn",tone === "warn" || /WAIT|COUNT|COAST/.test(state));
        nodes.state.classList.toggle("is-bad",tone === "bad" || /ABORT|FAULT|ERROR/.test(state));
        setText(nodes.clockLabel,state.replace(/_/g," "));
        const timer = timerParts(data);
        setText(nodes.clockTag,timer.tag);
        setText(nodes.clockTime,timer.body);

        const speed = rawSpeed(data);
        const gforce = rawGforce(data);
        const altitude = rawAltitude(data);
        setText(nodes.speed,formatNumber(Math.max(0,speed),1));
        setText(nodes.gforce,formatNumber(Math.max(0,gforce),2));
        setText(nodes.altitude,formatNumber(altitude,1));
        setProgress(nodes.speedInstrument,Math.max(0,speed),100);
        setProgress(nodes.gforceInstrument,Math.max(0,gforce),20);
        setProgress(nodes.altitudeInstrument,Math.max(0,altitude),300);

        const arm = pick(data,["armText"],null);
        const sw = pick(data,["swOn","s","sw"],null);
        setText(nodes.arm,arm != null ? arm : (sw == null ? "--" : (Number(sw) ? "ON" : "OFF")));
        const delayMs = finite(pick(data,["ignitionDelayMs","ignition_delay_ms"],NaN));
        setText(nodes.ignitionDelay,Number.isFinite(delayMs) && delayMs >= 0 ? (delayMs / 1000).toFixed(2) : "--");
        const pyro = pick(data,["pyroText"],null);
        const pyroChannel = finite(pick(data,["pyroChannel","pyro_ch"],NaN));
        setText(nodes.pyro,pyro != null ? pyro : (Number.isFinite(pyroChannel) ? "CH" + Math.round(pyroChannel) : "--"));
        const storage = finite(pick(data,["storagePercent","storage_pct"],NaN));
        setText(nodes.storage,Number.isFinite(storage) ? storage.toFixed(1) + "%" : "--");
        updateTimeline(data);
      }
      function websocketUrl(){
        const explicit = String(params.get("ws") || "").trim();
        if(explicit) return explicit;
        const source = String(params.get("source") || "").trim();
        if(source){
          try{
            const url = new URL(source);
            url.protocol = url.protocol === "https:" ? "wss:" : "ws:";
            url.pathname = "/ws";
            url.search = "";
            url.hash = "";
            return url.href;
          }catch(_error){}
        }
        if(location.protocol === "http:" || location.protocol === "https:"){
          return (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws";
        }
        return "";
      }
      function connectSocket(){
        const url = websocketUrl();
        if(!url || socket && (socket.readyState === 0 || socket.readyState === 1)) return;
        try{
          socket = new WebSocket(url);
          socket.onmessage = (event)=>{
            try{ consume(JSON.parse(event.data)); }catch(_error){}
          };
          socket.onclose = ()=>{
            socket = null;
            clearTimeout(reconnectTimer);
            reconnectTimer = setTimeout(connectSocket,1200);
          };
          socket.onerror = ()=>{ try{ socket.close(); }catch(_error){} };
        }catch(_error){
          reconnectTimer = setTimeout(connectSocket,1600);
        }
      }
      try{
        if("BroadcastChannel" in window){
          const channel = new BroadcastChannel(CHANNEL_NAME);
          channel.onmessage = (event)=>consume(event.data);
        }
      }catch(_error){}
      try{
        const cached = localStorage.getItem(SYNC_KEY);
        if(cached) consume(JSON.parse(cached));
      }catch(_error){}
      window.addEventListener("storage",(event)=>{
        if(event.key !== SYNC_KEY || !event.newValue) return;
        try{ consume(JSON.parse(event.newValue)); }catch(_error){}
      });
      setText(nodes.mission,configuredMission);
      setInterval(()=>{
        const stale = !lastMessageAt || Date.now() - lastMessageAt > 2500;
        if(!stale) return;
        document.body.classList.add("is-offline");
        nodes.source.classList.remove("is-online");
        if(lastSample){
          const stage = Math.max(1,Math.min(2,Math.round(finite(pick(lastSample,["stageId","stage_id"],1)) || 1)));
          setText(nodes.source,"STAGE " + stage + " OFFLINE");
        }
      },500);
      connectSocket();
    })();
  </script>
</body>
</html>
